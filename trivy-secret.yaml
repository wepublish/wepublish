# Secret-scanning exceptions for Trivy (loaded automatically by `trivy fs`).
# Only path-scoped allow-rules — the private-key detector stays active for
# every other file in the repository.
allow-rules:
  - id: local-dev-jwt-key-env
    description: >-
      Intentionally committed Ed25519 dev keypair for local development
      (not used in any deployed environment).
    path: ^\.env$

  - id: local-dev-jwt-key-docker-compose
    description: >-
      Same local-dev JWT keypair referenced by the local docker-compose setup.
    path: ^docker-compose\.yml$
