overwrite: true

# Runs automatically after every codegen invocation, so a bare
# `graphql-codegen` produces buildable output without a separate step.
hooks:
  afterAllFileWrite:
    - node tools/generateApiIndex.js


generates:
  # client-preset (the GraphQL Guild's recommended setup). It replaces the
  # near-operation-file + typescript-react-apollo pair: operations are emitted
  # as `TypedDocumentNode` consts that Apollo Client 4 infers from directly, so
  # no generated hooks and no compat shim are needed.
  ./libs/editor/api/src/lib/gql/:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/editor/api/src/lib/schemas/*.graphql
    preset: client
    presetConfig:
      # Components consume plain fragment types, not masked references.
      fragmentMasking: false
    plugins:
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
    config:
      # Keeps the huge block-union fragments within TypeScript's instantiation
      # limits, as the previous setup did.
      inlineFragmentTypes: combine
      # Enum members are used as runtime values throughout the apps.
      enumType: native
      # Restores the `__typename` discriminants the apps switch on.
      skipTypename: false
      nonOptionalTypename: true
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  # client-preset only emits types that operations select. A lot of app code
  # imports the schema's object types directly (`Tag`, `MemberPlan`, `Event`,
  # ...), so they are generated separately and re-exported by name from the
  # library entry point.
  ./libs/editor/api/src/lib/schema-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      enumType: native
      skipTypename: false
      nonOptionalTypename: true
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  ./libs/editor/api/src/lib/possible-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - fragment-matcher

  # client-preset (the GraphQL Guild's recommended setup). It replaces the
  # near-operation-file + typescript-react-apollo pair: operations are emitted
  # as `TypedDocumentNode` consts that Apollo Client 4 infers from directly, so
  # no generated hooks and no compat shim are needed.
  ./libs/website/api/src/lib/gql/:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/website/api/src/lib/schemas/*.graphql
    preset: client
    presetConfig:
      # Components consume plain fragment types, not masked references.
      fragmentMasking: false
    plugins:
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
    config:
      # Keeps the huge block-union fragments within TypeScript's instantiation
      # limits, as the previous setup did.
      inlineFragmentTypes: combine
      # Enum members are used as runtime values throughout the apps.
      enumType: native
      # Restores the `__typename` discriminants the apps switch on.
      skipTypename: false
      nonOptionalTypename: true
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  # client-preset only emits types that operations select. A lot of app code
  # imports the schema's object types directly (`Tag`, `MemberPlan`, `Event`,
  # ...), so they are generated separately and re-exported by name from the
  # library entry point.
  ./libs/website/api/src/lib/schema-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      enumType: native
      skipTypename: false
      nonOptionalTypename: true
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  ./libs/website/api/src/lib/possible-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - fragment-matcher

  # Split for the same reason as the peering targets below: typescript-operations
  # v6 emits the enums/inputs an operation uses, which would collide with the
  # `typescript` plugin's schema types if both wrote into one file.
  ./libs/testing/src/graphql/schema-public.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  ./libs/testing/src/graphql/graphql-public.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents: ./libs/testing/src/graphql/public/*.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      # `documentMode: string` makes typescript-document-nodes emit
      # `new TypedDocumentString(...)` but only the client preset would emit the
      # class itself, so it has to be added manually.
      - add:
          content: "import type {DocumentTypeDecoration} from '@graphql-typed-document-node/core';"
      - add:
          content: |
            export class TypedDocumentString<TResult, TVariables>
              extends String
              implements DocumentTypeDecoration<TResult, TVariables>
            {
              __apiType?: NonNullable<DocumentTypeDecoration<TResult, TVariables>['__apiType']>;
              private value: string;
              public __meta__?: Record<string, any> | undefined;

              constructor(value: string, __meta__?: Record<string, any> | undefined) {
                super(value);
                this.value = value;
                this.__meta__ = __meta__;
              }

              override toString(): string & DocumentTypeDecoration<TResult, TVariables> {
                return this.value;
              }
            }
      - typescript-operations
      - typescript-document-nodes
    config:
      documentMode: string
      importSchemaTypesFrom: './libs/testing/src/graphql/schema-public'
      scalars:
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  # Schema types live in their own file: typescript-operations v6 emits the
  # enums/inputs an operation uses, which collides with the `typescript`
  # plugin's output when both run into a single file. `importSchemaTypesFrom`
  # below makes the operations file import them instead of re-declaring them.
  ./libs/peering/api/src/lib/remote/schema.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
      - fragment-matcher
    config:
      scalars:
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File

  ./libs/peering/api/src/lib/remote/graphql.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/peering/api/src/lib/remote/*.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript-operations
      - typescript-document-nodes
    config:
      importSchemaTypesFrom: './libs/peering/api/src/lib/remote/schema'
      scalars:
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File
