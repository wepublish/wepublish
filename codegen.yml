overwrite: true

generates:
  # Deliberately not `preset: client`; see .claude/docs/graphql-prisma.md.
  ./libs/editor/api/src/lib/gql/graphql.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/editor/api/src/lib/schemas/*.graphql
    plugins:
      - add:
          content: '/* eslint-disable */'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript-operations
      - typed-document-node
    config:
      importSchemaTypesFrom: './libs/editor/api/src/lib/schema-types'
      # Keeps the huge block-union fragments within TypeScript's instantiation
      # limits.
      inlineFragmentTypes: combine
      nonOptionalTypename: true
      scalars: &scalars
        VoteValue: number
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File
        PuckSpacing: "number | `${ number }px`"
        PuckMinHeight: "`${ number }px` | `${ number }vh`"
        PuckMaxWidth: "'sm' | 'md' | 'lg' | 'xl' | `${ number }px` | `${ number }%`"
        PuckBackgroundPosition: "`${'left' | 'center' | 'right'} ${'top' | 'center' | 'bottom'}`"

  # The schema's own object types (`Tag`, `MemberPlan`, `Event`, ...) are used
  # as domain models throughout the apps, and the operations file imports its
  # enums and inputs from here.
  ./libs/editor/api/src/lib/schema-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      nonOptionalTypename: true
      scalars: *scalars

  ./libs/editor/api/src/lib/possible-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - fragment-matcher

  ./libs/website/api/src/lib/gql/graphql.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/website/api/src/lib/schemas/*.graphql
    plugins:
      - add:
          content: '/* eslint-disable */'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript-operations
      - typed-document-node
    config:
      importSchemaTypesFrom: './libs/website/api/src/lib/schema-types'
      inlineFragmentTypes: combine
      nonOptionalTypename: true
      scalars: *scalars

  ./libs/website/api/src/lib/schema-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      nonOptionalTypename: true
      scalars: *scalars

  ./libs/website/api/src/lib/possible-types.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - fragment-matcher

  # Schema types live in their own file: typescript-operations v6 emits the
  # enums/inputs an operation uses, which collides with the `typescript`
  # plugin's output when both run into a single file. `importSchemaTypesFrom`
  # below makes the operations file import them instead of re-declaring them.
  ./libs/peering/api/src/lib/remote/schema.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript
    config:
      scalars:
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File
        PuckSpacing: "number | `${ number }px`"
        PuckMinHeight: "`${ number }px` | `${ number }vh`"
        PuckMaxWidth: "'sm' | 'md' | 'lg' | 'xl' | `${ number }px` | `${ number }%`"
        PuckBackgroundPosition: "`${'left' | 'center' | 'right'} ${'top' | 'center' | 'bottom'}`"

  ./libs/peering/api/src/lib/remote/graphql.ts:
    schema:
      - ./apps/api-example/schema-v2.graphql
    documents:
      - ./libs/peering/api/src/lib/remote/*.graphql
    plugins:
      - add:
          content: '// THIS FILE IS AUTOGENERATED, EDIT WITH CAUTION'
      - add:
          content: "import {RichtextJSONDocument} from '@wepublish/richtext';"
      - typescript-operations
      - typescript-document-nodes
    config:
      importSchemaTypesFrom: './libs/peering/api/src/lib/remote/schema'
      scalars:
        Date: string
        DateTime: string
        Color: string
        Slug: string
        RichText: RichtextJSONDocument
        Upload: File
        PuckSpacing: "number | `${ number }px`"
        PuckMinHeight: "`${ number }px` | `${ number }vh`"
        PuckMaxWidth: "'sm' | 'md' | 'lg' | 'xl' | `${ number }px` | `${ number }%`"
        PuckBackgroundPosition: "`${'left' | 'center' | 'right'} ${'top' | 'center' | 'bottom'}`"
