version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    # socat makes MinIO answer on 127.0.0.1:9000 inside this container as well:
    # S3_PUBLIC_HOST in .env points there (the host browser reaches it through
    # storage's published port) and the media server checks that URL itself
    # before redirecting to it.
    command:
      [
        'sh',
        '-c',
        'socat TCP-LISTEN:9000,bind=127.0.0.1,fork,reuseaddr TCP:storage:9000 & exec sleep infinity',
      ]

    networks:
      - default

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  database:
    image: postgres:18
    command: postgres -c shared_preload_libraries=pg_stat_statements
    ports:
      - 5432:5432
    volumes:
      - database_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wepublish
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - default

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  storage:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=password
    entrypoint: ['/bin/sh']
    command: [
        '-ec',
        "mkdir -p /data/wepublish-staff /data/wepublish-transformed; \
        exec minio server /data --console-address=:9001",
      ]
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - default
    volumes:
      - storage_data:/data

  # Makes wepublish-transformed publicly readable, as ../docker-compose.yml
  # does: the media server redirects browsers to it. Exits once done; it fails
  # and is restarted until storage accepts connections.
  storage-init:
    image: minio/minio:latest
    depends_on:
      - storage
    entrypoint: ['/bin/sh']
    command:
      [
        '-ec',
        'mc alias set local http://storage:9000 root password; mc anonymous set download local/wepublish-transformed',
      ]
    restart: on-failure
    networks:
      - default

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    # Same flags and ACL as ../docker-compose.yml (mirrors dragonfly01).
    command:
      - --aclfile=/etc/dragonfly/users.acl
      - --proactor_threads=2
      - --maxmemory=1gb
      - --cache_mode=true
    volumes:
      - ../docker/dragonfly/users.acl:/etc/dragonfly/users.acl:ro
    networks:
      - default

  mailpit:
    image: axllent/mailpit:latest
    # SMTP endpoint on 1025 (the app connects via MAIL_SMTP_HOST=mailpit),
    # web UI on 8025 to read caught mails.
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - default

  gotenberg:
    image: gotenberg/gotenberg:8
    # Pdf renderer for letters; the app reaches it via GOTENBERG_URL=http://gotenberg:3000.
    networks:
      - default

volumes:
  database_data:
  storage_data:
