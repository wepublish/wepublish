fragment ExternalAppApiToken on ApiToken {
  id
  name
  prefix
  scopes
  expiresAt
  revokedAt
  lastUsedAt
}

fragment ExternalApp on ExternalApp {
  createdAt
  icon
  id
  modifiedAt
  name
  description
  target
  url
  apiTokenId
  apiToken {
    ...ExternalAppApiToken
  }
}

query ExternalApp($externalAppId: String!) {
  externalApp(id: $externalAppId) {
    ...ExternalApp
  }
}

query ExternalApps($filter: ExternalAppFilter) {
  externalApps(filter: $filter) {
    ...ExternalApp
  }
}

mutation CreateExternalApp($input: CreateExternalAppInput!) {
  createExternalApp(input: $input) {
    ...ExternalApp
  }
}

mutation UpdateExternalApp(
  $icon: String
  $name: String
  $description: String
  $target: ExternalAppsTarget
  $url: String
  $apiTokenId: String
  $updateExternalAppId: String!
) {
  updateExternalApp(
    icon: $icon
    name: $name
    description: $description
    target: $target
    url: $url
    apiTokenId: $apiTokenId
    id: $updateExternalAppId
  ) {
    ...ExternalApp
  }
}

mutation DeleteExternalApp($deleteExternalAppId: String!) {
  deleteExternalApp(id: $deleteExternalAppId) {
    ...ExternalApp
  }
}

mutation CreateExternalAppToken($externalAppId: String!) {
  createExternalAppToken(externalAppId: $externalAppId) {
    token
    expiresAt
  }
}
