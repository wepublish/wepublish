fragment ArticleTemplateMetadata on ArticleTemplateMetadata {
  preTitle
  title
  lead
  seoTitle
  seoDescription
  canonicalUrl
  breaking
  hideAuthor
  shared
  hidden
  disableComments
  paywallId
  socialMediaTitle
  socialMediaDescription

  tags {
    id
    tag
  }

  authors {
    role

    author {
      ...FullAuthor
    }
  }

  socialMediaAuthors {
    ...FullAuthor
  }

  image {
    ...FullImage
  }

  socialMediaImage {
    ...FullImage
  }

  properties {
    key
    value
    public
  }
}

fragment FullArticleTemplate on ArticleTemplate {
  id
  createdAt
  modifiedAt

  blockTemplate {
    ...FullBlockTemplate

    puckBlocks(onlyDisplayed: false) {
      ...FullPuckBlock
    }

    puckRegistry {
      ...FullPuckRegistry
    }
  }

  metadata {
    ...ArticleTemplateMetadata
  }
}

query ArticleTemplateList(
  $filter: ArticleTemplateFilter
  $cursorId: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: ArticleTemplateSort
) {
  articleTemplates(
    filter: $filter
    cursorId: $cursorId
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      id
      createdAt
      modifiedAt

      blockTemplate {
        id
        name

        puckBlocks(onlyDisplayed: false) {
          id
        }
      }
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query ArticleTemplate($id: String!) {
  articleTemplate(id: $id) {
    ...FullArticleTemplate
  }
}

mutation CreateArticleTemplate(
  $name: String!
  $blocks: [BlockContentInput!] = []
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
  $metadata: ArticleTemplateMetadataInput!
) {
  createArticleTemplate(
    name: $name
    blocks: $blocks
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
    metadata: $metadata
  ) {
    ...FullArticleTemplate
  }
}

mutation UpdateArticleTemplate(
  $id: String!
  $name: String!
  $blocks: [BlockContentInput!]
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
  $metadata: ArticleTemplateMetadataInput!
) {
  updateArticleTemplate(
    id: $id
    name: $name
    blocks: $blocks
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
    metadata: $metadata
  ) {
    ...FullArticleTemplate
  }
}

mutation DeleteArticleTemplate($id: String!) {
  deleteArticleTemplate(id: $id) {
    id
  }
}
