fragment FullGateAction on GateAction {
  id
  label
  url
  style
  role
}

fragment FullGate on Gate {
  id
  createdAt
  modifiedAt
  mode
  name
  active

  audience
  anyMemberPlan
  memberPlans {
    id
    name
  }
  bypasses {
    id
    token
  }

  showOnArticles
  showOnPages {
    id
  }

  title
  text
  cta
  html
  embedUrl
  image {
    ...FullImage
  }

  description
  upgradeDescription
  circumventDescription
  upgradeCircumventDescription
  softDescription

  actions {
    ...FullGateAction
  }

  previewBlocks
  fadeout

  freeArticles
  softGateArticles
  meterWindowDays
  newsletterParams {
    key
    value
  }
  newsletterNeverGate
  newsletterFreeArticles

  collapsible
  hideForMinutes
  delay
}

query Gates($mode: GateMode!, $skip: Int, $take: Int) {
  gates(mode: $mode, skip: $skip, take: $take) {
    ...FullGate
  }
}

query Gate($id: String!) {
  gate(id: $id) {
    ...FullGate
  }
}

mutation CreateGate($input: CreateGateInput!) {
  createGate(input: $input) {
    ...FullGate
  }
}

mutation UpdateGate($input: UpdateGateInput!) {
  updateGate(input: $input) {
    ...FullGate
  }
}

mutation DeleteGate($id: String!) {
  deleteGate(id: $id) {
    ...FullGate
  }
}
