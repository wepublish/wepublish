fragment FullAudio on Audio {
  id

  createdAt
  modifiedAt

  title
  filename
  extension
  fileSize
  mimeType

  description

  source
  link
  license

  duration

  url
}

query AudioStorageUsage {
  audioStorageUsage {
    usedBytes
    limitBytes
    audioCount
  }
}

query AudioList($filter: String, $cursorId: String, $take: Int, $skip: Int) {
  audios(
    filter: { title: $filter }
    cursorId: $cursorId
    take: $take
    skip: $skip
  ) {
    nodes {
      ...FullAudio
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query Audio($id: String!) {
  audio(id: $id) {
    ...FullAudio
  }
}

mutation UploadAudio(
  $title: String
  $description: String
  $file: Upload!
  $filename: String
  $source: String
  $link: String
  $license: String
  $duration: Float
) {
  uploadAudio(
    title: $title
    description: $description
    file: $file
    filename: $filename
    source: $source
    link: $link
    license: $license
    duration: $duration
  ) {
    ...FullAudio
  }
}

mutation UpdateAudio(
  $id: String!
  $title: String
  $description: String
  $source: String
  $link: String
  $license: String
) {
  updateAudio(
    id: $id
    title: $title
    description: $description
    source: $source
    link: $link
    license: $license
  ) {
    ...FullAudio
  }
}

mutation DeleteAudio($id: String!) {
  deleteAudio(id: $id)
}
