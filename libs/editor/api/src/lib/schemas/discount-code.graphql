fragment FullDiscountCode on DiscountCode {
  id
  createdAt
  modifiedAt

  code
  discountPercent

  usageCount
  paidUsageCount

  validFrom
  validTo

  minReferrals

  memberPlanId
  memberPlan {
    id
    name
  }
}

query DiscountCodeList(
  $filter: DiscountCodeFilter
  $cursor: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: DiscountCodesort
) {
  discountCodes(
    filter: $filter
    cursorId: $cursor
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      ...FullDiscountCode
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query DiscountCode($id: String!) {
  discountCode(id: $id) {
    ...FullDiscountCode
  }
}

mutation CreateDiscountCode(
  $code: String!
  $discountPercent: Int!
  $memberPlanId: String!
  $validFrom: DateTime!
  $validTo: DateTime!
  $minReferrals: Int
) {
  createDiscountCode(
    code: $code
    discountPercent: $discountPercent
    memberPlanId: $memberPlanId
    validFrom: $validFrom
    validTo: $validTo
    minReferrals: $minReferrals
  ) {
    ...FullDiscountCode
  }
}

mutation UpdateDiscountCode(
  $id: String!
  $code: String
  $discountPercent: Int
  $memberPlanId: String
  $validFrom: DateTime
  $validTo: DateTime
  $minReferrals: Int
) {
  updateDiscountCode(
    id: $id
    code: $code
    discountPercent: $discountPercent
    memberPlanId: $memberPlanId
    validFrom: $validFrom
    validTo: $validTo
    minReferrals: $minReferrals
  ) {
    ...FullDiscountCode
  }
}

mutation DeleteDiscountCode($id: String!) {
  deleteDiscountCode(id: $id) {
    ...FullDiscountCode
  }
}

query DiscountCodeUsages(
  $discountCodeId: String!
  $take: Int
  $skip: Int
  $sort: InvoiceSort
  $order: SortOrder
) {
  invoices(
    filter: { discountCodeId: $discountCodeId }
    take: $take
    skip: $skip
    sort: $sort
    order: $order
  ) {
    nodes {
      id
      createdAt
      mail
      total
      currency
      paidAt
      canceledAt
      subscriptionID
    }

    totalCount
  }
}
