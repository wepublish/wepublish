fragment FullToken on BaseToken {
  id
  name
  roleIDs
}

query TokenList {
  tokens {
    ...FullToken
  }
}

mutation CreateToken($name: String!, $roleIDs: [String!]) {
  createToken(name: $name, roleIDs: $roleIDs) {
    ...FullToken
    token
  }
}

mutation UpdateToken($id: String!, $roleIDs: [String!]) {
  updateToken(id: $id, roleIDs: $roleIDs) {
    ...FullToken
  }
}

mutation DeleteToken($id: String!) {
  deleteToken(id: $id) {
    ...FullToken
  }
}
