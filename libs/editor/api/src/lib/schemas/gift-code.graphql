fragment FullGiftCodeOffer on GiftCodeOffer {
  id
  createdAt
  modifiedAt

  name
  description
  active
  issueBeforePayment
  allowDiscountCodes
  periodicity
  redemptionWindowMonths

  imageID
  image {
    ...FullImage
  }

  memberPlanId
  memberPlan {
    id
    name
    currency
  }

  paymentMethodIds
  paymentMethods {
    id
    name
    slug
  }

  autoRenew
  renewalPaymentMethodId
  renewalPaymentMethod {
    id
    name
  }

  price {
    amount
    currency
  }
}

query GiftCodeOfferList(
  $filter: GiftCodeOfferFilter
  $cursor: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: GiftCodeOfferSort
) {
  giftCodeOffers(
    filter: $filter
    cursorId: $cursor
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      ...FullGiftCodeOffer
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query GiftCodeOffer($id: String!) {
  giftCodeOffer(id: $id) {
    ...FullGiftCodeOffer
  }
}

mutation CreateGiftCodeOffer(
  $name: String!
  $description: RichText
  $active: Boolean!
  $issueBeforePayment: Boolean!
  $allowDiscountCodes: Boolean
  $memberPlanId: String!
  $periodicity: PaymentPeriodicity!
  $redemptionWindowMonths: Int
  $imageID: String
  $paymentMethodIds: [String!]!
  $autoRenew: Boolean
  $renewalPaymentMethodId: String
) {
  createGiftCodeOffer(
    name: $name
    description: $description
    active: $active
    issueBeforePayment: $issueBeforePayment
    allowDiscountCodes: $allowDiscountCodes
    memberPlanId: $memberPlanId
    periodicity: $periodicity
    redemptionWindowMonths: $redemptionWindowMonths
    imageID: $imageID
    paymentMethodIds: $paymentMethodIds
    autoRenew: $autoRenew
    renewalPaymentMethodId: $renewalPaymentMethodId
  ) {
    ...FullGiftCodeOffer
  }
}

mutation UpdateGiftCodeOffer(
  $id: String!
  $name: String
  $description: RichText
  $active: Boolean
  $issueBeforePayment: Boolean
  $allowDiscountCodes: Boolean
  $memberPlanId: String
  $periodicity: PaymentPeriodicity
  $redemptionWindowMonths: Int
  $imageID: String
  $paymentMethodIds: [String!]
  $autoRenew: Boolean
  $renewalPaymentMethodId: String
) {
  updateGiftCodeOffer(
    id: $id
    name: $name
    description: $description
    active: $active
    issueBeforePayment: $issueBeforePayment
    allowDiscountCodes: $allowDiscountCodes
    memberPlanId: $memberPlanId
    periodicity: $periodicity
    redemptionWindowMonths: $redemptionWindowMonths
    imageID: $imageID
    paymentMethodIds: $paymentMethodIds
    autoRenew: $autoRenew
    renewalPaymentMethodId: $renewalPaymentMethodId
  ) {
    ...FullGiftCodeOffer
  }
}

mutation DeleteGiftCodeOffer($id: String!) {
  deleteGiftCodeOffer(id: $id) {
    id
  }
}

fragment GiftCodeListItem on GiftCode {
  id
  code
  status
  paid
  source
  recipientName

  buyerId
  buyer {
    id
    name
    firstName
  }

  redeemedBy {
    id
    name
    firstName
  }

  redeemedInvoice {
    id
    subscriptionID
    createdAt
  }

  createdBy {
    id
    name
    firstName
  }

  offerId
  offer {
    id
    name
  }

  memberPlanId
  memberPlan {
    id
    name
  }

  periodicity
  redemptionWindowMonths
  amount
  currency
  invoiceId

  createdAt
  issuedAt
  expiresAt
  redeemedAt
  canceledAt
  cancellationReason
}

query GiftCodeList(
  $filter: GiftCodeFilter
  $cursor: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: GiftCodeSort
) {
  giftCodes(
    filter: $filter
    cursorId: $cursor
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      ...GiftCodeListItem
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query GiftCode($id: String!) {
  giftCode(id: $id) {
    ...GiftCodeListItem
  }
}

mutation CreateGiftCodes(
  $offerId: String!
  $count: Int!
  $recipientName: String
) {
  createGiftCodes(
    offerId: $offerId
    count: $count
    recipientName: $recipientName
  ) {
    ...GiftCodeListItem
  }
}

mutation CancelGiftCode($id: String!) {
  cancelGiftCode(id: $id) {
    ...GiftCodeListItem
  }
}
