query PdfRendererSettings {
  pdfRendererSettings {
    cloudflare_accountId
    createdAt
    id
    lastLoadedAt
    modifiedAt
    name
    timeoutMs
    type
  }
}

mutation UpdatePdfRendererSetting(
  $type: PdfRendererType
  $cloudflare_accountId: String
  $cloudflare_apiToken: String
  $id: String!
  $name: String
  $timeoutMs: Int
) {
  updatePdfRendererSetting(
    type: $type
    cloudflare_accountId: $cloudflare_accountId
    cloudflare_apiToken: $cloudflare_apiToken
    id: $id
    name: $name
    timeoutMs: $timeoutMs
  ) {
    cloudflare_accountId
    createdAt
    id
    lastLoadedAt
    modifiedAt
    name
    timeoutMs
    type
  }
}

mutation CreatePdfRendererSetting(
  $id: String!
  $type: PdfRendererType!
  $name: String
) {
  createPdfRendererSetting(id: $id, type: $type, name: $name) {
    createdAt
    id
    lastLoadedAt
    modifiedAt
    name
    type
  }
}

mutation DeletePdfRendererSetting($id: String!) {
  deletePdfRendererSetting(id: $id) {
    id
  }
}
