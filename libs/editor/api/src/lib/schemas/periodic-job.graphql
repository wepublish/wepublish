fragment FullPeriodicJob on PeriodicJob {
  id
  date
  error
  executionTime
  finishedWithError
  modifiedAt
  running
  successfullyFinished
  tries
  createdAt
}

query PeriodicJobLogs($skip: Int, $take: Int) {
  periodicJobLog(skip: $skip, take: $take) {
    ...FullPeriodicJob
  }
}

mutation RetryPeriodicJob {
  retryPeriodicJob {
    ...FullPeriodicJob
  }
}
