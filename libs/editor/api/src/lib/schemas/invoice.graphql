fragment Invoice on Invoice {
  id
  total
  items {
    createdAt
    modifiedAt
    name
    description
    quantity
    amount
    total
    goodieId
    goodie {
      id
      name
    }
  }
  dueAt
  paidAt
  description
  mail
  manuallySetAsPaidByUserId
  manuallySetAsPaidByUser {
    id
    firstName
    name
  }
  canceledAt
  scheduledDeactivationAt
  modifiedAt
  createdAt
  currency
  payments {
    id
    state
    createdAt
    paymentMethod {
      id
      name
      paymentProviderID
    }
  }
}

query Invoices(
  $cursorId: String
  $take: Int
  $skip: Int
  $filter: InvoiceFilter
  $sort: InvoiceSort
  $order: SortOrder
) {
  invoices(
    cursorId: $cursorId
    take: $take
    skip: $skip
    filter: $filter
    sort: $sort
    order: $order
  ) {
    nodes {
      ...Invoice
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    totalCount
  }
}

mutation MarkInvoiceAsPaid($id: String!, $sendMail: Boolean) {
  markInvoiceAsPaid(id: $id, sendMail: $sendMail) {
    ...Invoice
  }
}
