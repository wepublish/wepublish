fragment FullVideo on Video {
  id

  createdAt
  modifiedAt

  title
  filename
  extension
  fileSize
  mimeType

  description

  url
}

query VideoStorageUsage {
  videoStorageUsage {
    usedBytes
    limitBytes
    videoCount
  }
}

query VideoList($filter: String, $cursorId: String, $take: Int, $skip: Int) {
  videos(
    filter: { title: $filter }
    cursorId: $cursorId
    take: $take
    skip: $skip
  ) {
    nodes {
      ...FullVideo
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query Video($id: String!) {
  video(id: $id) {
    ...FullVideo
  }
}

mutation UploadVideo(
  $title: String
  $description: String
  $file: Upload!
  $filename: String
) {
  uploadVideo(
    title: $title
    description: $description
    file: $file
    filename: $filename
  ) {
    ...FullVideo
  }
}

mutation UpdateVideo($id: String!, $title: String, $description: String) {
  updateVideo(id: $id, title: $title, description: $description) {
    ...FullVideo
  }
}

mutation DeleteVideo($id: String!) {
  deleteVideo(id: $id)
}
