fragment BlockTemplateContent on BlockContent {
  ...BlockWithoutTeaser

  ... on TeaserGridFlexBlock {
    title
    disabled
    blockStyle
    blockStyleName
    type
    flexTeasers {
      alignment {
        i
        x
        y
        w
        h
        static
      }

      teaser {
        ...FullTeaser
      }
    }
  }

  ... on TeaserGridBlock {
    title
    disabled
    blockStyle
    blockStyleName
    type
    teasers {
      ...FullTeaser
    }
    numColumns
  }

  ... on TeaserListBlock {
    title
    disabled
    blockStyle
    blockStyleName
    type
    skip
    take
    sort
    teaserType
    filter {
      tags
      tagObjects {
        id
        tag
      }
    }
    teasers {
      ...FullTeaser
    }
  }

  ... on TeaserSlotsBlock {
    title
    disabled
    blockStyle
    blockStyleName
    type
    autofillConfig {
      enabled
      filter {
        tags
        tagObjects {
          id
          tag
        }
      }
      sort
      teaserType
    }
    slots {
      type
      teaser {
        __typename
        ...FullTeaser
      }
    }
    autofillTeasers {
      ...FullTeaser
    }
  }

  ... on FlexBlock {
    disabled
    blockStyle
    blockStyleName
    type
    blocks {
      alignment {
        i
        x
        y
        w
        h
        static
      }
      block {
        __typename
        ...BlockWithoutTeaser
        ...NestedTeaserBlock

        ... on BlockTemplateBlock {
          ...NestedBlockTemplateBlock
        }
      }
    }
  }

  ... on BlockTemplateBlock {
    ...NestedBlockTemplateBlock
  }
}

fragment NestedBlockTemplateBlock on BlockTemplateBlock {
  disabled
  blockStyle
  blockStyleName
  type
  templateId
  template {
    id
    createdAt
    modifiedAt
    name
  }
}

fragment FullBlockTemplate on BlockTemplate {
  id
  createdAt
  modifiedAt
  name
  blocks(onlyDisplayed: false) {
    ...BlockTemplateContent
  }
}

query BlockTemplateList(
  $filter: BlockTemplateFilter
  $cursorId: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: BlockTemplateSort
) {
  blockTemplates(
    filter: $filter
    cursorId: $cursorId
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      ...FullBlockTemplate

      puckBlocks(onlyDisplayed: false) {
        id
      }
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query BlockTemplate($id: String!) {
  blockTemplate(id: $id) {
    ...FullBlockTemplate
  }
}

mutation CreateBlockTemplate(
  $name: String!
  $blocks: [BlockContentInput!] = []
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
) {
  createBlockTemplate(
    name: $name
    blocks: $blocks
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
  ) {
    ...FullBlockTemplate
  }
}

mutation UpdateBlockTemplate(
  $id: String!
  $name: String!
  $blocks: [BlockContentInput!]
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
) {
  updateBlockTemplate(
    id: $id
    name: $name
    blocks: $blocks
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
  ) {
    ...FullBlockTemplate
  }
}

fragment PuckBlockTemplate on BlockTemplate {
  id
  createdAt
  modifiedAt
  name

  puckBlocks(onlyDisplayed: false) {
    ...FullPuckBlock
  }

  puckRegistry {
    ...FullPuckRegistry
  }

  linkedTemplateIds
}

query PuckBlockTemplateList($take: Int, $skip: Int, $name: String) {
  blockTemplates(
    filter: { puck: true, name: $name }
    take: $take
    skip: $skip
    sort: Name
  ) {
    nodes {
      ...PuckBlockTemplate
    }

    totalCount

    pageInfo {
      hasNextPage
    }
  }
}

query PuckBlockTemplate($id: String!) {
  blockTemplate(id: $id) {
    ...PuckBlockTemplate
  }
}

mutation CreatePuckBlockTemplate(
  $name: String!
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
) {
  createBlockTemplate(
    name: $name
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
  ) {
    ...PuckBlockTemplate
  }
}

mutation UpdatePuckBlockTemplate(
  $id: String!
  $name: String!
  $puckBlocks: [PuckBlockInput!]
  $puckRegistry: PuckRegistryInput
) {
  updateBlockTemplate(
    id: $id
    name: $name
    puckBlocks: $puckBlocks
    puckRegistry: $puckRegistry
  ) {
    ...PuckBlockTemplate
  }
}

mutation DeleteBlockTemplate($id: String!) {
  deleteBlockTemplate(id: $id) {
    ...FullBlockTemplate
  }
}

query PuckBlockTemplateOptions($name: String) {
  blockTemplates(filter: { puck: true, name: $name }, take: 100, sort: Name) {
    nodes {
      id
      name
      linkedTemplateIds
    }
  }
}
