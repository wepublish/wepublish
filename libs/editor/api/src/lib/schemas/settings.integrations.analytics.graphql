query SettingsIntegrationsAnalytics {
  analyticsProviderSettings {
    id
    createdAt
    modifiedAt
    lastLoadedAt

    type
    name

    articlePrefix
    property
    url
    hotAndTrending
  }
}

mutation UpdateAnalyticsProviderSetting(
  $id: String!
  $name: String
  $property: String
  $articlePrefix: String
  $credentials: SettingAnalyticsCredentialsInput
  $apiKey: String
  $url: String
  $hotAndTrending: Boolean
) {
  updateAnalyticsProviderSetting(
    id: $id
    name: $name
    property: $property
    articlePrefix: $articlePrefix
    credentials: $credentials
    apiKey: $apiKey
    url: $url
    hotAndTrending: $hotAndTrending
  ) {
    id
    createdAt
    modifiedAt
    lastLoadedAt

    type
    name

    articlePrefix
    property
    url
    hotAndTrending
  }
}

mutation CreateAnalyticsProviderSetting(
  $id: String!
  $type: AnalyticsProviderType!
  $name: String
) {
  createAnalyticsProviderSetting(id: $id, type: $type, name: $name) {
    createdAt
    id
    lastLoadedAt
    modifiedAt
    name
    type
  }
}
