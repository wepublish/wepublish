query PromptHTML($query: String!, $chatId: String) {
  promptHTML(query: $query, chatId: $chatId) {
    chatId
    message
  }
}

query GenerateSeoMetadata($input: GenerateSeoMetadataInput!) {
  generateSeoMetadata(input: $input) {
    seoTitle
    seoDescription
    socialMediaTitle
    socialMediaDescription
    slug
  }
}
