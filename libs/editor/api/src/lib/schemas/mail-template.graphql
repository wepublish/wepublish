query MailTemplate {
  mailTemplates {
    ...TinyMailTemplate
  }
  provider {
    ...FullMailProvider
  }
}

# The template table: every template with what its columns and filters show.
query MailTemplateList {
  mailTemplates {
    ...ListMailTemplate
  }
}

query MailTemplateById($id: String!) {
  mailTemplate(id: $id) {
    ...FullMailTemplate
  }
}

mutation CreateMailTemplate($input: MailTemplateInput!) {
  createMailTemplate(input: $input) {
    ...FullMailTemplate
  }
}

mutation UpdateMailTemplate($id: String!, $input: MailTemplateInput!) {
  updateMailTemplate(id: $id, input: $input) {
    ...FullMailTemplate
  }
}

mutation DeleteMailTemplate($id: String!) {
  deleteMailTemplate(id: $id)
}

mutation DeleteMailTemplateVariant($templateId: String!, $channel: MailChannel!) {
  deleteMailTemplateVariant(templateId: $templateId, channel: $channel)
}

mutation ImportMailTemplatesFromProvider {
  importMailTemplatesFromProvider
}

query MailTemplateSubscriptions($query: String) {
  mailTemplateSubscriptions(query: $query) {
    id
    label
  }
}

query MailTemplatePreview($input: MailTemplatePreviewInput!) {
  mailTemplatePreview(input: $input) {
    subject
    html
    text
  }
}

query LetterChannelAvailable {
  letterChannelAvailable
}

query MailTemplateLetterPreview($input: MailTemplatePreviewInput!) {
  mailTemplateLetterPreview(input: $input) {
    pdf
  }
}

mutation SendTestMailTemplate($input: SendTestMailTemplateInput!) {
  sendTestMailTemplate(input: $input)
}

# Everything the list views and template pickers render. Deliberately without
# htmlContent/textContent: those are whole email bodies, and loading every one of
# them to populate a dropdown made the response grow with each new template.
fragment TinyMailTemplate on MailTemplateModel {
  id
  name
  description
  subject
  context
  status
  channels
}

# A row of the template table. The pickers do without these fields, so they
# stay out of the tiny fragment.
fragment ListMailTemplate on MailTemplateModel {
  ...TinyMailTemplate
  letterLayoutName
  letterAppendixName
  memberPlans {
    id
    name
  }
}

# Adds the mail bodies. Only the single-template edit view needs these.
fragment FullMailTemplate on MailTemplateModel {
  ...TinyMailTemplate
  variants {
    ...MailTemplateVariant
  }
}

# What a template says on one channel. The letter version carries the
# stationery and the appendix; the email version the plain-text alternative.
fragment MailTemplateVariant on MailTemplateVariantModel {
  id
  channel
  subject
  htmlContent
  textContent
  sameAsMail
  letterLayoutId
  letterAppendixId
}

fragment FullMailProvider on MailProviderModel {
  name
}
