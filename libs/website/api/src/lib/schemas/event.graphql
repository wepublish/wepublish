fragment FullEvent on Event {
  id
  slug
  name
  description
  status
  scheduleType
  location
  image {
    ...FullImage
  }
  tags {
    ...FullTag
  }
  startsAt
  endsAt
  url
}

fragment FullEventDetail on Event {
  ...FullEvent
  latest {
    id
    blocks {
      ...FullBlock
    }
  }
}

query EventList(
  $filter: EventFilter
  $cursor: String
  $take: Int
  $skip: Int
  $order: SortOrder
  $sort: EventSort
) {
  events(
    filter: $filter
    cursorId: $cursor
    take: $take
    skip: $skip
    order: $order
    sort: $sort
  ) {
    nodes {
      ...FullEvent
    }

    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }

    totalCount
  }
}

query Event($id: String, $slug: Slug) {
  event(id: $id, slug: $slug) {
    ...FullEventDetail
  }
}
