fragment FullContentGate on ContentGate {
  id
  audience
  freeArticles
  softGateArticles
  meterWindowDays
  softDescription
  hardDescription
  ctaLabel
  ctaUrl
  newsletterParams {
    key
    value
  }
  newsletterNeverGate
  newsletterFreeArticles
}

query ArticleUnlocked($id: String!) {
  article(id: $id) {
    id

    latest {
      id

      blocks(unlockContentGate: true) {
        ...FullBlock
      }
    }
  }
}
