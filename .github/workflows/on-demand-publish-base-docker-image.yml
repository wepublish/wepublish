name: Publish docker base image

on:
  workflow_call:

jobs:
  build-and-push-base-image:
    name: Build and push base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate hash of the pnpm lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "HASH=$(cat pnpm-lock.yaml pnpm-workspace.yaml Dockerfile | sha256sum | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "pnpm-lock.yaml not found, exiting."
            exit 1
          fi

      - name: Set hash tag
        run: echo "HASHED_TAG=ghcr.io/wepublish/base-image:${{ env.HASH }}" >> $GITHUB_ENV

      - name: Check if image exists
        id: check-image
        run: |
          if docker manifest inspect ${{ env.HASHED_TAG }} > /dev/null 2>&1; then
            echo "Image with hash ${{ env.HASH }} already exists."
            echo "image-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image with hash ${{ env.HASH }} does not exist."
            echo "image-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        if: steps.check-image.outputs.image-exists == 'false'
        with:
          provenance: false
          target: base-image
          push: true
          tags: |
            ${{ env.HASHED_TAG }}