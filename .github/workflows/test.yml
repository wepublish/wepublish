name: Tests

on:
  push:
    branches:
      - master
      - development
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wepublish_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'
        with:
          main-branch-name: master
      - run: bash ./tools/ci/nx-scoped.sh -t test --exclude='*website*' -- -t test --configuration=ci --parallel=10
        env:
          NX_SCOPE: ${{ github.event_name == 'pull_request' && (vars.NX_AFFECTED_SCOPE || 'shadow') || 'full' }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 3
          NODE_OPTIONS: '--max-old-space-size=4096'
          JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIJWbdZ23hpurtFiEpnulSfJ1U4TwbkiDWmbGZSDVx3nR\n-----END PRIVATE KEY-----"
          JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA93mjXbSful1W9nAVHuYHdRfgKEF+pvkwm4/5P27J4RA=\n-----END PUBLIC KEY-----"
          DATABASE_URL: 'postgresql://postgres:test@localhost:5432/wepublish_test?schema=public'

      - name: Upload coverage to Codecov
        run: bash ./tools/ci/codecov-upload.sh
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          FORK_BRANCH: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.label || '' }}

      - run: pnpm exec nx fix-ci
        if: always()

  Test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "$SHARDS" != "success" ]]; then
            echo "Test shards finished with '$SHARDS'."
            exit 1
          fi
        env:
          SHARDS: ${{ needs.shard.result }}
