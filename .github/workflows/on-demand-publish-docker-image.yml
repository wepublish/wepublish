name: Publish docker image

on:
  workflow_call:
    inputs:
      editor_tags:
        required: false
        type: string
      api_tags:
        required: false
        type: string
      migration_tags:
        required: false
        type: string
      storybook_tags:
        required: false
        type: string
      media_tags:
        required: false
        type: string
      media_fallback_url:
        required: false
        type: string

jobs:
  calculate-base-image-tag:
    name: Calculate hash for base image
    runs-on: ubuntu-latest
    outputs:
      hashed_tag: ${{ steps.hash.outputs.hashed_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Calculate hash of the pnpm lockfile
        id: hash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            HASH=$(cat pnpm-lock.yaml pnpm-workspace.yaml Dockerfile | sha256sum | awk '{print $1}')
            echo "hashed_tag=ghcr.io/wepublish/base-image:${HASH}" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm-lock.yaml not found, exiting."
            exit 1
          fi

  build-and-push-docker-api:
    name: Build and push api
    runs-on: ubuntu-latest
    needs: calculate-base-image-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.calculate-base-image-tag.outputs.hashed_tag }}
    if: inputs.api_tags != ''
    steps:
      - uses: actions/checkout@v7
      - name: Create .version file
        run: echo "${{ github.sha }}" > .version
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          provenance: false
          context: .
          target: api
          push: true
          tags: |
            ${{ inputs.api_tags }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE_TAG }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=wepublish-foundation
            SENTRY_PROJECT=wepublish-cms
            SENTRY_RELEASE=${{ github.sha }}
            APP_RELEASE_ID=${{ github.sha }}
  build-and-push-docker-editor:
    name: Build and push editor
    runs-on: ubuntu-latest
    needs: calculate-base-image-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.calculate-base-image-tag.outputs.hashed_tag }}
    if: inputs.editor_tags != ''
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          provenance: false
          target: editor
          push: true
          tags: |
            ${{ inputs.editor_tags }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE_TAG }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=wepublish-foundation
            SENTRY_PROJECT=wepublish-cms
            SENTRY_RELEASE=${{ github.sha }}
            APP_RELEASE_ID=${{ github.sha }}
  build-and-push-docker-migration:
    name: Build and push migration
    runs-on: ubuntu-latest
    needs: calculate-base-image-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.calculate-base-image-tag.outputs.hashed_tag }}
    if: inputs.migration_tags != ''
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          provenance: false
          target: migration
          push: true
          tags: |
            ${{ inputs.migration_tags }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE_TAG }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=wepublish-foundation
            SENTRY_PROJECT=wepublish-cms
            SENTRY_RELEASE=${{ github.sha }}
            APP_RELEASE_ID=${{ github.sha }}
  build-and-push-docker-media:
    name: Build and push media
    runs-on: ubuntu-latest
    needs: calculate-base-image-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.calculate-base-image-tag.outputs.hashed_tag }}
    if: inputs.media_tags != ''
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          provenance: false
          target: media
          push: true
          tags: |
            ${{ inputs.media_tags }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE_TAG }}
            MEDIA_FALLBACK_URL=${{ inputs.media_fallback_url }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=wepublish-foundation
            SENTRY_PROJECT=wepublish-cms
            SENTRY_RELEASE=${{ github.sha }}
            APP_RELEASE_ID=${{ github.sha }}
  build-and-push-storybook:
    name: Build and push storybook
    runs-on: ubuntu-latest
    needs: calculate-base-image-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.calculate-base-image-tag.outputs.hashed_tag }}
    if: inputs.storybook_tags != ''
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          provenance: false
          target: storybook
          push: true
          tags: |
            ${{ inputs.storybook_tags }}
          build-args: BUILD_IMAGE=${{ env.BUILD_IMAGE_TAG }}
