name: Review

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    uses: ./.github/workflows/changes.yml

  check-review-deploy-label:
    runs-on: ubuntu-latest
    outputs:
      has_label: ${{ steps.review_label.outputs.has_label }}
    steps:
      - name: Check for a review_ label
        id: review_label
        run: |
          has_label="false"
          labels=$(echo '${{ toJSON(github.event.pull_request.labels) }}' | jq -r '.[].name')
          for label in $labels; do
            if [[ "$label" == review_* ]]; then
                has_label="true"
                echo "Review label found: $label"
                break
            fi
          done

          echo "has_label=$has_label" >> "$GITHUB_OUTPUT"

  publish_docker_base_image:
    name: Docker base image
    if: needs.check-review-deploy-label.outputs.has_label == 'false'
    needs: [ check-review-deploy-label ]
    uses: ./.github/workflows/on-demand-publish-base-docker-image.yml
    secrets: inherit

  publish_docker_image:
    needs: [publish_docker_base_image, changes]
    name: Docker backend images
    uses: ./.github/workflows/on-demand-publish-docker-image.yml
    with:
      editor_tags: ${{ needs.changes.outputs.code == 'true' && format('ghcr.io/wepublish/editor:{0}', github.sha) || '' }}
      api_tags: ${{ needs.changes.outputs.code == 'true' && format('ghcr.io/wepublish/api:{0}', github.sha) || '' }}
      migration_tags: ${{ needs.changes.outputs.code == 'true' && format('ghcr.io/wepublish/migration:{0}', github.sha) || '' }}
      storybook_tags: ${{ needs.changes.outputs.code == 'true' && format('ghcr.io/wepublish/storybook:{0}', github.sha) || '' }}
      media_tags: ${{ needs.changes.outputs.code == 'true' && format('ghcr.io/wepublish/media:{0}', github.sha) || '' }}
    secrets: inherit


  setup-website-matrix:
    runs-on: ubuntu-latest
    if: needs.check-review-deploy-label.outputs.has_label == 'false' && needs.changes.outputs.code == 'true'
    needs: [ check-review-deploy-label, changes ]
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      has_targets: ${{ steps.affected.outputs.has_targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master
      - name: Set up matrix
        id: set-matrix
        run: deployment/read_deployment_config.sh '.website.review.deployment' true
      - name: Keep the affected websites
        id: affected
        shell: bash
        env:
          NX_SCOPE: ${{ vars.NX_AFFECTED_SCOPE || 'shadow' }}
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          affected="$(bash ./tools/ci/nx-scoped.sh --list --type app | jq -R . | jq -sc .)"
          matrix="$(jq -c --argjson affected "$affected" '.target |= map(select(IN($affected[])))' <<<"$MATRIX")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "has_targets=$(jq '.target | length > 0' <<<"$matrix")" >>"$GITHUB_OUTPUT"
          echo "Websites to build: $(jq -r '.target | join(", ")' <<<"$matrix")"

  publish_docker_website_image:
    name: Build Docker Website
    needs: [setup-website-matrix, publish_docker_base_image]
    if: needs.setup-website-matrix.outputs.has_targets == 'true'
    uses: ./.github/workflows/on-demand-publish-docker-image-website.yml
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.setup-website-matrix.outputs.matrix)}}
    with:
      website_project: ${{ matrix.target }}
      api_url: https://api-${{ github.event.pull_request.number }}.reviews.wepublish.works
      environment: review
      website_tags: |
        ghcr.io/wepublish/website-${{ matrix.target }}:${{ github.sha }}
    secrets: inherit
  notify:
    name: Notify
    needs: [publish_docker_website_image, check-review-deploy-label, publish_docker_image]
    if: ${{ !cancelled() && needs.publish_docker_image.result == 'success' && (needs.publish_docker_website_image.result == 'success' || needs.publish_docker_website_image.result == 'skipped') }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config/package-lock.json
      - name: Create Deployment Text
        id: deploymentComment
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ needs.check-review-deploy-label.outputs.has_label }}
        run: |
          cd ./config
          npm ci
          OUTPUT=$(node ./notify-github.js)
          OUTPUT="${OUTPUT//$'\n'/'%0A'}"
          OUTPUT="${OUTPUT//$'\r'/'%0D'}"
          echo "result=$OUTPUT" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ${{ steps.deploymentComment.outputs.result }}