name: Review

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-review-deploy-label:
    runs-on: ubuntu-latest
    outputs:
      has_label: ${{ steps.review_label.outputs.has_label }}
    steps:
      - name: Check for a review_ label
        id: review_label
        run: |
          has_label="false"
          labels=$(echo '${{ toJSON(github.event.pull_request.labels) }}' | jq -r '.[].name')
          for label in $labels; do
            if [[ "$label" == review_* ]]; then
                has_label="true"
                echo "Review label found: $label"
                break
            fi
          done

          echo "has_label=$has_label" >> "$GITHUB_OUTPUT"

  publish_docker_image:
    name: Docker backend images
    needs: [ check-review-deploy-label ]
    if: needs.check-review-deploy-label.outputs.has_label == 'false'
    uses: ./.github/workflows/on-demand-publish-docker-image.yml
    secrets: inherit

  notify:
    name: Notify
    needs: [ check-review-deploy-label ]
    if: needs.check-review-deploy-label.outputs.has_label == 'false'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config/package-lock.json
      - name: Create Deployment Text
        id: deploymentComment
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ needs.check-review-deploy-label.outputs.has_label }}
        run: |
          cd ./config
          npm ci
          OUTPUT=$(node ./notify-github.js)
          OUTPUT="${OUTPUT//$'\n'/'%0A'}"
          OUTPUT="${OUTPUT//$'\r'/'%0D'}"
          echo "result=$OUTPUT" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ${{ steps.deploymentComment.outputs.result }}
