name: Website Typecheck

on:
  push:
    branches:
      - master
      - development
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'
        with:
          main-branch-name: master
      - run: |
          apps="$(bash ./tools/ci/nx-scoped.sh --list --type app)"
          if [[ -z "$apps" ]]; then
            echo "No affected apps to typecheck."
            exit 0
          fi
          bash ./tools/typecheck-websites.sh $apps
        env:
          NX_SCOPE: ${{ github.event_name == 'pull_request' && (vars.NX_AFFECTED_SCOPE || 'shadow') || 'full' }}
