name: Website Typecheck

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  Typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'
        with:
          main-branch-name: master
      - run: bash ./tools/ci/nx-scoped.sh -t typecheck --exclude=editor -- -t typecheck --parallel=3
        env:
          NX_SCOPE: ${{ github.event_name == 'pull_request' && (vars.NX_AFFECTED_SCOPE || 'shadow') || 'full' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
      - run: pnpm exec nx fix-ci
        if: always()

  build-api:
    name: Build api-example
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run api-example:build --skip-nx-cache
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
