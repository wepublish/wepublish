name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares the branch against the pull request's base, so
          # the history both sides share has to be present.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Check for a changelog entry
        # Labelling the pull request "no-changelog" drops the requirement, but
        # every entry that IS there is still validated — a placeholder nobody
        # filled in must not reach an instance.
        env:
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$EXEMPT" = "true" ]; then
            echo "Labelled no-changelog — only validating the entries that exist."
            pnpm run changelog:check
          else
            pnpm run changelog:check --since "origin/${{ github.base_ref }}"
          fi
