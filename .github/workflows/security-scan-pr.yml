name: Security (PR)

on:
  pull_request:
    branches: [master, development]
    types: [opened, synchronize, reopened]

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR diff)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: >-
            --only-verified

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Non-blocking: reports HIGH/CRITICAL dependency vulnerabilities without
      # failing the check (tracked for cleanup; most findings have fixed versions).
      - name: Run Trivy (vulnerabilities, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 0

      # Blocking: committed secrets fail the check. Intentional dev keys are
      # allow-listed per path in trivy-secret.yaml at the repo root.
      - name: Run Trivy (secrets, blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: 1