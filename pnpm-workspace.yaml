packages:
  - .
  - apps/api-example
  - apps/editor
  - apps/media
  - docker/migration

strictPeerDependencies: false

# Which dependencies are allowed to run post install scripts
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  esbuild: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@apollo/protobufjs': false
  core-js: false
  core-js-pure: false
  cypress: false
  protobufjs: false

# Runtime dependencies of the deployed apps; apps/*/package.json and the root
# package.json both reference these, so a version lives in exactly one place
catalog:
  '@apollo/server': '^5.5.1'
  '@as-integrations/express5': '^1.1.2'
  '@faker-js/faker': '^10.1.0'
  '@google-analytics/data': '^4.8.0'
  '@keyv/redis': '^5.1.6'
  '@mailchimp/mailchimp_marketing': '^3.0.80'
  '@mailchimp/mailchimp_transactional': '^1.0.50'
  '@mollie/api-client': '^4.1.0'
