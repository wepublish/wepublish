receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch: {}
  transform/redact:
    error_mode: ignore
    log_statements:
      - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "***@***")

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    mapping:
      mode: otel
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    compression: none
  otlp_http/logstash:
    logs_endpoint: http://logstash:8080
    encoding: json
    compression: none
    retry_on_failure:
      enabled: false
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_http/prometheus
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - elasticsearch
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/redact
        - batch
      exporters:
        - elasticsearch
        - otlp_http/logstash
