input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  split {
    field => "[resourceLogs]"
  }
  split {
    field => "[resourceLogs][scopeLogs]"
  }
  split {
    field => "[resourceLogs][scopeLogs][logRecords]"
  }
  ruby {
    code => '
      value_of = lambda do |v|
        next nil unless v.is_a?(Hash)
        ["stringValue", "intValue", "boolValue", "doubleValue"].map { |k| v[k] }.compact.first
      end

      resource_logs = event.get("[resourceLogs]") || {}
      labels = {}

      (((resource_logs["resource"] || {})["attributes"]) || []).each do |attribute|
        key = attribute["key"].to_s
        value = value_of.call(attribute["value"])
        case key
        when "service.name" then event.set("[service][name]", value)
        when "service.instance.id" then event.set("[service][instance][id]", value)
        else labels[key.tr(".", "_")] = value
        end
      end

      record = ((resource_logs["scopeLogs"] || {})["logRecords"]) || {}

      (record["attributes"] || []).each do |attribute|
        labels[attribute["key"].to_s.tr(".", "_")] = value_of.call(attribute["value"])
      end

      event.set("[labels]", labels) unless labels.empty?

      body = value_of.call(record["body"])
      event.set("[message]", body.to_s) unless body.nil?
      event.set("[log][level]", record["severityText"]) if record["severityText"]

      nanos = (record["timeUnixNano"] || record["observedTimeUnixNano"]).to_i
      event.set("@timestamp", LogStash::Timestamp.at(nanos / 1_000_000_000, (nanos % 1_000_000_000) / 1000.0)) if nanos > 0
    '
  }
  mutate {
    remove_field => ["resourceLogs", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-wepublish-%{+YYYY.MM.dd}"
  }
}
