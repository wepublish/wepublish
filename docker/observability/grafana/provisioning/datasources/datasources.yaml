apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: es-logs
    uid: es-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: logs-*
      timeField: '@timestamp'
      logMessageField: body.text
      logLevelField: severity_text

  - name: es-traces
    uid: es-traces
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: traces-*
      timeField: '@timestamp'
