coverage:
  status:
    patch:
      default:
        target: 90%
        if_not_found: error
        if_ci_failed: error
    changes:
      default:
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
comment:
  layout: "condensed_header, diff, components, condensed_files, condensed_footer"
flag_management:
  default_rules:
    carryforward: true
component_management:
  individual_components:
    - component_id: api
      name: API
      paths:
        - "libs/api/**"
        - "libs/nest-modules/**"
        - "libs/**/api/**"
    - component_id: editor
      name: Editor
      paths:
        - "libs/**/editor/**"
    - component_id: website
      name: Website
      paths:
        - "libs/website/**"
        - "libs/**/website/**"
ignore:
  - "apps"
  - "config"
  - "deployment"
  - "docker"
  - "helm"
  - "tools"
  - "**/*.stories.tsx"
  - "libs/testing"
  - "libs/storybook"
  - "**/*.model.ts"
  - "**/*.module.ts"
