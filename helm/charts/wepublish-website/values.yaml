deployment:
  imagePullPolicy: Always
  imagePullSecret:
  env:
    API_URL: https://api
    # Optional cluster-internal API URL used for SSR/SSG only.
    # When unset, server-side falls back to API_URL.
    # API_URL_INTERNAL: http://wepublish-api:4000
    FRONTEND_URL: https://front

# Routing configuration
# Set routingType to "ingress" (default) or "route" (for OpenShift)
routing:
  type: ingress  # Options: "ingress" or "route"
  ingress:
    enabled: true
    className: ""
    annotations: {}
    # Example annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls: []
    # Example TLS configuration:
    # - secretName: wepublish-website-tls
    #   hosts:
    #     - website.example.com
  route:
    enabled: false
    annotations: {}
    tls:
      enabled: true
      termination: edge  # Options: edge, passthrough, reencrypt
      insecureEdgeTerminationPolicy: Redirect  # Options: Redirect, Allow, None

website:
  image: ghcr.io/wepublish/website
  env:
    NODE_ENV: production
  envFromSecretRefName:
  dynamicEnv: {}
  properties: {}
  replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 768Mi
      cpu: 500m

labels: {}

# OpenTelemetry (opt-in). When enabled, every long-running Node container gets
# the OTEL_* env and wepublish.ch/{tenant,component,environment} pod labels.
# Logs, traces and metrics are all pushed over OTLP; nothing is scraped. Env
# names already set in env, deployment.env or dynamicEnv are left to the
# user's value.
observability:
  enabled: false
  # OTLP/HTTP receiver for logs, traces and metrics, e.g.
  # http://otel-collector.wepublish-observability.svc:4318
  otlpEndpoint: ""
  # Defaults to deployment.env.APP_NAME; required when enabled if that is unset.
  tenant: ""
  # staging | production. Defaults to deployment.env.APP_ENVIRONMENT.
  environment: ""
  # Website only: also export Next.js traces (OTEL_WEBSITE_TRACES).
  websiteTraces: false
