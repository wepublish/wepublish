version: '3.7'

networks:
  app-tier:
    driver: bridge

services:
  migration:
    image: wepublishch/migration:master
    platform: linux/amd64
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres@database:5432/wepublish?schema=public
    depends_on:
      - database
    restart: on-failure
    networks:
      - app-tier
  api:
    image: wepublishch/api:master
    platform: linux/amd64
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      CONFIG_FILE_PATH: /config.yaml
      DATABASE_URL: postgresql://postgres@database:5432/wepublish?schema=public
      HOST_URL: http://localhost:4000
      MEDIA_SERVER_URL: http://localhost:4100
      MEDIA_SERVER_INTERNAL_URL: http://media:4100
      WEBSITE_URL: http://localhost:4200
      JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIJWbdZ23hpurtFiEpnulSfJ1U4TwbkiDWmbGZSDVx3nR\n-----END PRIVATE KEY-----"
      JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA93mjXbSful1W9nAVHuYHdRfgKEF+pvkwm4/5P27J4RA=\n-----END PUBLIC KEY-----"
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: '1025'
      MAIL_SMTP_FROM: no-reply@wepublish.local
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_URL: ''
    env_file: .env
    volumes:
      - ./apps/api-example/src/default.yaml:/config.yaml
    depends_on:
      - database
      - migration
      - mailpit
      - gotenberg
    networks:
      - app-tier
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    # Same version and ACL rules as dragonfly01.wepublish.cloud: each medium's
    # user may only touch keys starting with its own name. See docker/dragonfly/users.acl.
    command:
      - --aclfile=/etc/dragonfly/users.acl
      - --proactor_threads=2
      - --maxmemory=1gb
      - --cache_mode=true
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./docker/dragonfly/users.acl:/etc/dragonfly/users.acl:ro
    networks:
      - app-tier
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # SMTP endpoint (providers connect here) + web UI to read caught mails.
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks:
      - app-tier
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      # Pdf renderer for letters; the api reaches it as http://gotenberg:3000.
      - '127.0.0.1:3030:3000'
    networks:
      - app-tier
  editor:
    image: wepublishch/editor:master
    platform: linux/amd64
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      ADDRESS: 0.0.0.0
      API_URL: http://localhost:4000
    depends_on:
      - api
  database:
    image: postgres:18
    ports:
      - '5432:5432'
    volumes:
      - database:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wepublish
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - app-tier
  media:
    image: wepublishch/media:master
    platform: linux/amd64
    ports:
      - '127.0.0.1:4100:4100'
    environment:
      API_URL: http://api:4000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: 'storage'
      S3_PORT: '9000'
      MEDIA_FALLBACK_URL: ${MEDIA_FALLBACK_URL}
    depends_on:
      - storage
    networks:
      - app-tier
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@admin.com'
      PGADMIN_DEFAULT_PASSWORD: 'root'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '127.0.0.1:8000:80'
    depends_on:
      - database
    networks:
      - app-tier

  storage:
    image: rustfs/rustfs:1.0.6
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /etc/rustfs/entrypoint.sh rustfs &
        pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        until curl -fsS http://127.0.0.1:9000/health/ready >/dev/null 2>&1; do
          kill -0 $$pid
          sleep 1
        done
        rc alias set local http://127.0.0.1:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        rc bucket create --ignore-existing local/wepublish-staff
        rc bucket create --ignore-existing local/wepublish-transformed
        rc bucket anonymous set download local/wepublish-transformed
        wait $$pid
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - rustfs:/data
    networks:
      - app-tier

volumes:
  database:
    driver: local
  rustfs:
    driver: local
